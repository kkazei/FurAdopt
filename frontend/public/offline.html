<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FurAdopt Offline</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0b1d2c; color: #f2f6ff; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .card { background: #12263a; border-radius: 14px; padding: 24px; max-width: 360px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.35); }
    h1 { margin: 0 0 12px; font-size: 1.4rem; }
    p { margin: 0 0 14px; color: #d7e4ff; }
    .cta { color: #6bc2ff; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <h1>You are offline</h1>
    <p>Some features (chat, adoption updates) need a connection. We will auto-retry when you're back online.</p>
    <p><a class="cta" href="/">Return to FurAdopt</a></p>
  </div>
</body>
</html>
